<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test JSONBin</title>
<style>
    body { font-family: monospace; padding: 20px; max-width: 700px; margin: auto; }
    input, button { padding: 8px; font-size: 14px; margin: 4px 0; width: 100%; }
    button { background: #2c3e50; color: #fff; border: none; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .ok { color: green; }
    .err { color: red; }
</style>
</head>
<body>
    <h2>Test Koneksi JSONBin</h2>

    <label>Bin ID:</label>
    <input id="binId" value="6a852125f5f4af5e2926f117">

    <label>Master Key:</label>
    <input id="masterKey" placeholder="Paste Master Key di sini">

    <button onclick="testRead()">1. Test BACA (GET)</button>
    <button onclick="testWrite()">2. Test TULIS (PUT)</button>

    <pre id="result">Hasil akan muncul di sini...</pre>

<script>
async function testRead() {
    const binId = document.getElementById('binId').value.trim();
    const key = document.getElementById('masterKey').value.trim();
    const result = document.getElementById('result');
    result.textContent = 'Menguji GET...';

    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
            headers: { 'X-Master-Key': key }
        });
        const text = await res.text();
        result.innerHTML = `Status: ${res.status}\n\n${text}`;
        result.className = res.ok ? 'ok' : 'err';
    } catch (e) {
        result.textContent = 'Error: ' + e.message;
        result.className = 'err';
    }
}

async function testWrite() {
    const binId = document.getElementById('binId').value.trim();
    const key = document.getElementById('masterKey').value.trim();
    const result = document.getElementById('result');
    result.textContent = 'Menguji PUT...';

    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': key
            },
            body: JSON.stringify({ id: 'root', type: 'folder', name: 'Test OK', children: [] })
        });
        const text = await res.text();
        result.innerHTML = `Status: ${res.status}\n\n${text}`;
        result.className = res.ok ? 'ok' : 'err';
    } catch (e) {
        result.textContent = 'Error: ' + e.message;
        result.className = 'err';
    }
}
</script>
</body>
</html>
