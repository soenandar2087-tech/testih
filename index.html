<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Lembar Kerja</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6fa;
            color: #2d3436;
            max-width: 920px;
            margin: 0 auto;
            padding: 24px 16px;
            line-height: 1.5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        h1 { font-size: 20px; color: #2c3e50; }
        .badge {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }
        .b-ok { background: #d4efdf; color: #196f3d; }
        .b-wait { background: #fef9e7; color: #b7950b; }
        .b-err { background: #fdedec; color: #c0392b; }
        .nav {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #e8e8e8;
            margin-bottom: 16px;
        }
        .nav button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
        }
        .nav button:hover { background: #f0f0f0; }
        .path {
            flex: 1;
            font-size: 14px;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }
        .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all .15s;
        }
        .btn-p { background: #2c3e50; color: #fff; }
        .btn-p:hover { background: #34495e; }
        .btn-s { background: #fff; color: #2c3e50; border: 1px solid #ddd; }
        .btn-s:hover { background: #f8f9fa; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 18px 12px 12px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all .15s;
        }
        .card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,.07);
            transform: translateY(-2px);
        }
        .icon { font-size: 42px; cursor: pointer; margin-bottom: 8px; user-select: none; }
        .name {
            font-weight: 700;
            font-size: 13px;
            color: #2c3e50;
            cursor: pointer;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .name:hover { color: #3498db; }
        .meta { font-size: 11px; color: #999; margin-top: 4px; }
        .ca {
            display: flex;
            gap: 4px;
            margin-top: auto;
            padding-top: 10px;
            opacity: 0;
            transition: opacity .15s;
            width: 100%;
            justify-content: center;
        }
        .card:hover .ca { opacity: 1; }
        .bi {
            background: #f4f4f4;
            border: none;
            border-radius: 5px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
            color: #666;
            font-weight: 500;
        }
        .bi:hover { background: #e8e8e8; }
        .bi.dg:hover { background: #fdecea; color: #e74c3c; }
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 16px;
            color: #aaa;
            background: #fff;
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
        }
        .empty .ei { font-size: 48px; margin-bottom: 10px; }
        #ov {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.93);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            gap: 12px;
            transition: opacity .3s;
        }
        #ov.hide { opacity: 0; pointer-events: none; }
        .sp {
            width: 34px; height: 34px;
            border: 3px solid #ddd;
            border-top-color: #2c3e50;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 20px; right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 120;
            transform: translateY(80px);
            opacity: 0;
            transition: all .3s;
            color: #fff;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.ok { background: #27ae60; }
        .toast.er { background: #e74c3c; }

        /* ===== MODAL KUSTOM ===== */
        #modalBg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #modalBg.show { display: flex; }
        .modal {
            background: #fff;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            padding: 22px 22px 18px;
            box-shadow: 0 16px 48px rgba(0,0,0,.18);
            animation: pop .18s ease;
        }
        @keyframes pop {
            from { transform: scale(.94); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal h3 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 16px;
        }
        .modal label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        .modal label:first-of-type { margin-top: 0; }
        .modal input, .modal select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            background: #fff;
        }
        .modal input:focus, .modal select:focus { border-color: #2c3e50; }
        .modal .msg {
            font-size: 14px;
            color: #444;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .modal .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }
        .modal .actions button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .m-ok { background: #2c3e50; color: #fff; }
        .m-ok:hover { background: #34495e; }
        .m-cancel { background: #f0f0f0; color: #555; }
        .m-cancel:hover { background: #e4e4e4; }
        .m-danger { background: #e74c3c; color: #fff; }
        .m-danger:hover { background: #c0392b; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .card { min-height: 135px; padding: 14px 10px 12px; }
            .icon { font-size: 36px; }
            .ca { opacity: 1; }
            body { padding: 16px 10px; }
        }
    </style>
</head>
<body>

<div id="ov">
    <div class="sp"></div>
    <div style="font-size:14px;color:#555;font-weight:600">Menghubungkan ke cloud...</div>
</div>

<div class="header">
    <h1>📁 Arsip Lembar Kerja</h1>
    <span id="bd" class="badge b-wait">⏳ Menghubungkan</span>
</div>

<div class="nav">
    <button id="bb" onclick="goBack()" style="display:none">← Kembali</button>
    <span class="path" id="pt">Beranda</span>
</div>

<div class="toolbar">
    <button class="btn btn-s" onclick="newFolder()">📂 + Folder</button>
    <button class="btn btn-p" onclick="newLink()">📄 + Lembar Kerja</button>
</div>

<div class="grid" id="list"></div>
<div class="toast" id="toast"></div>

<div id="modalBg"></div>

<script>
var MASTER_KEY = "$2a$10$BCdyrhALUzXee8NI.yNV6.glef2ECbzFPRSrM62oIiC/mg/z3Z0H2";
var BIN_ID     = "6a852125f5f4af5e2926f117";
var API_URL    = "https://api.jsonbin.io/v3/b/" + BIN_ID;
var LKEY       = "arsip_cloud_v3";

var data = { id: "root", type: "folder", name: "Beranda", children: [] };
var cPath = [data];
var cFolder = data;
var sTimer = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function esc(t) {
    var d = document.createElement("div");
    d.textContent = String(t == null ? "" : t);
    return d.innerHTML;
}

function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); }
    catch (e) { return "link"; }
}

function normUrl(v) {
    var u = String(v || "").trim();
    if (!u) return null;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    try {
        var p = new URL(u);
        if (p.protocol !== "http:" && p.protocol !== "https:") return null;
        return p.href;
    } catch (e) { return null; }
}

function badge(txt, cls) {
    var e = document.getElementById("bd");
    e.textContent = txt;
    e.className = "badge " + cls;
}

function toast(msg, ok) {
    var e = document.getElementById("toast");
    e.textContent = msg;
    e.className = "toast show " + (ok ? "ok" : "er");
    setTimeout(function () { e.className = "toast"; }, 2500);
}

/* ===== MODAL KUSTOM (menggantikan prompt / confirm / alert) ===== */
function closeModal() {
    document.getElementById("modalBg").className = "";
    document.getElementById("modalBg").innerHTML = "";
}

function openModal(html) {
    var bg = document.getElementById("modalBg");
    bg.innerHTML = html;
    bg.className = "show";
    var first = bg.querySelector("input, select");
    if (first) setTimeout(function () { first.focus(); first.select && first.select(); }, 50);
}

function ask(title, fields, okText) {
    return new Promise(function (resolve) {
        var inputs = fields.map(function (f, i) {
            if (f.type === "select") {
                var opts = f.options.map(function (o) {
                    return '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>";
                }).join("");
                return '<label>' + esc(f.label) + '</label><select id="mf' + i + '">' + opts + "</select>";
            }
            return '<label>' + esc(f.label) + '</label><input id="mf' + i + '" type="text" value="' + esc(f.value || "") + '" placeholder="' + esc(f.placeholder || "") + '">';
        }).join("");

        openModal(
            '<div class="modal">' +
            "<h3>" + esc(title) + "</h3>" +
            inputs +
            '<div class="actions">' +
            '<button class="m-cancel" id="mCancel">Batal</button>' +
            '<button class="m-ok" id="mOk">' + esc(okText || "Simpan") + "</button>" +
            "</div></div>"
        );

        function finish(val) { closeModal(); resolve(val); }

        document.getElementById("mCancel").onclick = function () { finish(null); };
        document.getElementById("modalBg").onclick = function (e) {
            if (e.target.id === "modalBg") finish(null);
        };
        document.getElementById("mOk").onclick = function () {
            var vals = fields.map(function (_, i) {
                return document.getElementById("mf" + i).value;
            });
            finish(vals);
        };
        document.getElementById("modalBg").onkeydown = function (e) {
            if (e.key === "Enter") document.getElementById("mOk").click();
            if (e.key === "Escape") finish(null);
        };
    });
}

function confirmBox(title, message) {
    return new Promise(function (resolve) {
        openModal(
            '<div class="modal">' +
            "<h3>" + esc(title) + "</h3>" +
            '<div class="msg">' + esc(message) + "</div>" +
            '<div class="actions">' +
            '<button class="m-cancel" id="mCancel">Batal</button>' +
            '<button class="m-danger" id="mOk">Hapus</button>' +
            "</div></div>"
        );
        function finish(val) { closeModal(); resolve(val); }
        document.getElementById("mCancel").onclick = function () { finish(false); };
        document.getElementById("mOk").onclick = function () { finish(true); };
        document.getElementById("modalBg").onclick = function (e) {
            if (e.target.id === "modalBg") finish(false);
        };
        document.getElementById("modalBg").onkeydown = function (e) {
            if (e.key === "Escape") finish(false);
        };
    });
}

function alertBox(title, message) {
    return new Promise(function (resolve) {
        openModal(
            '<div class="modal">' +
            "<h3>" + esc(title) + "</h3>" +
            '<div class="msg">' + esc(message) + "</div>" +
            '<div class="actions"><button class="m-ok" id="mOk">OK</button></div>' +
            "</div>"
        );
        function finish() { closeModal(); resolve(); }
        document.getElementById("mOk").onclick = finish;
        document.getElementById("modalBg").onclick = function (e) {
            if (e.target.id === "modalBg") finish();
        };
        document.getElementById("modalBg").onkeydown = function (e) {
            if (e.key === "Enter" || e.key === "Escape") finish();
        };
    });
}

function normTree(item) {
    if (!item || typeof item !== "object") return null;
    var n = {
        id: item.id || uid(),
        name: String(item.name || "Tanpa Nama"),
        type: item.type === "link" ? "link" : "folder"
    };
    if (n.type === "folder") {
        n.children = Array.isArray(item.children) ? item.children.map(normTree).filter(Boolean) : [];
    } else {
        n.url = String(item.url || "https://");
    }
    return n;
}

function saveLocal() {
    try { localStorage.setItem(LKEY, JSON.stringify(data)); } catch (e) {}
}

function loadLocal() {
    try {
        var r = localStorage.getItem(LKEY);
        return r ? normTree(JSON.parse(r)) : null;
    } catch (e) { return null; }
}

async function cloudGet() {
    var res = await fetch(API_URL + "/latest", {
        method: "GET",
        headers: { "X-Master-Key": MASTER_KEY }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    var json = await res.json();
    return normTree(json.record || json);
}

async function cloudSave() {
    var res = await fetch(API_URL, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY,
            "X-Bin-Versioning": "false"
        },
        body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
}

function doSave() {
    saveLocal();
    clearTimeout(sTimer);
    sTimer = setTimeout(async function () {
        try {
            badge("⏳ Menyimpan...", "b-wait");
            await cloudSave();
            badge("● Online", "b-ok");
            toast("Tersimpan di cloud ✓", true);
        } catch (e) {
            badge("⚠ Gagal", "b-err");
            toast("Gagal sinkron cloud!", false);
        }
    }, 500);
}

function findPath(folder, id, path) {
    var p = (path || []).concat(folder);
    if (folder.id === id) return p;
    var ch = folder.children || [];
    for (var i = 0; i < ch.length; i++) {
        if (ch[i].type === "folder") {
            var r = findPath(ch[i], id, p);
            if (r) return r;
        }
    }
    return null;
}

function isDesc(parent, child) {
    if (parent === child) return true;
    if (parent.type !== "folder") return false;
    var ch = parent.children || [];
    for (var i = 0; i < ch.length; i++) {
        if (ch[i].type === "folder" && isDesc(ch[i], child)) return true;
    }
    return false;
}

function setFolder(path, updUrl) {
    cPath = path;
    cFolder = path[path.length - 1];
    if (updUrl !== false) history.replaceState(null, "", "#" + cFolder.id);
    render();
}

function openFolder(i) {
    var f = cFolder.children[i];
    if (f && f.type === "folder") setFolder(cPath.concat(f));
}

function goBack() {
    if (cPath.length > 1) setFolder(cPath.slice(0, -1));
}

async function newFolder() {
    var r = await ask("Folder baru", [
        { label: "Nama folder", placeholder: "Contoh: Administrasi" }
    ], "Buat");
    if (!r || !r[0].trim()) return;
    cFolder.children.push({ id: uid(), type: "folder", name: r[0].trim(), children: [] });
    render(); doSave();
}

async function newLink() {
    var r = await ask("Lembar kerja baru", [
        { label: "Nama lembar kerja", placeholder: "Contoh: Laporan Januari" },
        { label: "Alamat URL", value: "https://", placeholder: "https://..." }
    ], "Simpan");
    if (!r || !r[0].trim()) return;
    var u = normUrl(r[1]);
    if (!u) { await alertBox("URL tidak valid", "Masukkan alamat yang benar, misalnya https://docs.google.com"); return; }
    cFolder.children.push({ id: uid(), type: "link", name: r[0].trim(), url: u });
    render(); doSave();
}

async function editFolder(i) {
    var it = cFolder.children[i];
    var r = await ask("Ubah folder", [
        { label: "Nama folder", value: it.name }
    ], "Simpan");
    if (!r || !r[0].trim()) return;
    it.name = r[0].trim();
    render(); doSave();
}

async function editLink(i) {
    var it = cFolder.children[i];
    var r = await ask("Ubah lembar kerja", [
        { label: "Nama lembar kerja", value: it.name },
        { label: "Alamat URL", value: it.url }
    ], "Simpan");
    if (!r || !r[0].trim()) return;
    var u = normUrl(r[1]);
    if (!u) { await alertBox("URL tidak valid", "Masukkan alamat yang benar, misalnya https://docs.google.com"); return; }
    it.name = r[0].trim();
    it.url = u;
    render(); doSave();
}

async function delItem(i) {
    var it = cFolder.children[i];
    var ok = await confirmBox("Hapus item", 'Hapus "' + it.name + '"? Tindakan ini tidak bisa dibatalkan.');
    if (!ok) return;
    cFolder.children.splice(i, 1);
    render(); doSave();
}

async function moveItem(i) {
    var it = cFolder.children[i];
    var targets = [];
    (function scan(f, p) {
        if (it.type === "folder" && isDesc(it, f)) return;
        if (f !== cFolder) targets.push({ f: f, p: p });
        var ch = f.children || [];
        for (var j = 0; j < ch.length; j++) {
            if (ch[j].type === "folder") scan(ch[j], p + " / " + ch[j].name);
        }
    })(data, data.name);

    if (!targets.length) {
        await alertBox("Tidak bisa dipindah", "Tidak ada folder tujuan lain.");
        return;
    }

    var r = await ask("Pindahkan item", [
        {
            label: 'Pindahkan "' + it.name + '" ke folder:',
            type: "select",
            options: targets.map(function (t, idx) {
                return { value: String(idx), label: t.p };
            })
        }
    ], "Pindah");
    if (!r) return;
    var sel = parseInt(r[0], 10);
    if (isNaN(sel) || sel < 0 || sel >= targets.length) return;

    cFolder.children.splice(i, 1);
    targets[sel].f.children.push(it);
    render(); doSave();
}

function render() {
    document.getElementById("pt").textContent = cPath.map(function (f) { return f.name; }).join(" / ");
    document.getElementById("bb").style.display = cPath.length > 1 ? "block" : "none";

    var list = document.getElementById("list");
    var ch = cFolder.children || [];
    if (!ch.length) {
        list.innerHTML = '<div class="empty"><div class="ei">📂</div>Folder kosong.<br>Tambah folder atau lembar kerja baru di atas.</div>';
        return;
    }

    var items = ch.map(function (item, i) { return { item: item, i: i }; })
        .sort(function (a, b) {
            if (a.item.type === b.item.type) return 0;
            return a.item.type === "folder" ? -1 : 1;
        });

    list.innerHTML = items.map(function (row) {
        var it = row.item, i = row.i;
        if (it.type === "folder") {
            var cnt = (it.children || []).length;
            return '<div class="card">'
                + '<div class="icon" onclick="openFolder(' + i + ')">📁</div>'
                + '<div class="name" onclick="openFolder(' + i + ')" title="' + esc(it.name) + '">' + esc(it.name) + "</div>"
                + '<div class="meta">' + cnt + " item</div>"
                + '<div class="ca">'
                + '<button class="bi" onclick="editFolder(' + i + ')">✏️ Edit</button>'
                + '<button class="bi" onclick="moveItem(' + i + ')">📦 Pindah</button>'
                + '<button class="bi dg" onclick="delItem(' + i + ')">🗑️ Hapus</button>'
                + "</div></div>";
        }
        var u = JSON.stringify(it.url);
        return '<div class="card">'
            + '<div class="icon" onclick="window.open(' + u + ",'_blank','noopener')\">📄</div>"
            + '<div class="name" onclick="window.open(' + u + ",'_blank','noopener')\" title=\"" + esc(it.name) + '">' + esc(it.name) + "</div>"
            + '<div class="meta">' + esc(hostOf(it.url)) + "</div>"
            + '<div class="ca">'
            + '<button class="bi" onclick="editLink(' + i + ')">✏️ Edit</button>'
            + '<button class="bi" onclick="moveItem(' + i + ')">📦 Pindah</button>'
            + '<button class="bi dg" onclick="delItem(' + i + ')">🗑️ Hapus</button>'
            + "</div></div>";
    }).join("");
}

async function init() {
    try {
        var d = await cloudGet();
        data = d || data;
        badge("● Online", "b-ok");
        saveLocal();
    } catch (e) {
        var local = loadLocal();
        data = local || data;
        badge("⚠ Cadangan", "b-err");
        toast("Koneksi gagal, memakai cadangan lokal.", false);
    }

    var hid = location.hash.replace("#", "");
    var p = hid ? findPath(data, hid) : null;
    setFolder(p || [data], !p);
    document.getElementById("ov").className = "hide";
}

window.addEventListener("hashchange", function () {
    var id = location.hash.replace("#", "");
    var p = id ? findPath(data, id) : [data];
    if (p) setFolder(p, false);
});

init();
</script>
</body>
</html>
