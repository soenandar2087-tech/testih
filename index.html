<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arsip Lembar Kerja</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6fa;color:#2d3436;max-width:920px;margin:0 auto;padding:24px 16px;line-height:1.5}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:20px;color:#2c3e50}
#st{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.st-ok{background:#d4efdf;color:#196f3d}
.st-wait{background:#fef9e7;color:#b7950b}
.st-err{background:#fdedec;color:#c0392b}
.nav{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-radius:10px;border:1px solid #e8e8e8;margin-bottom:16px}
.nav button{background:none;border:none;color:#666;cursor:pointer;font-size:14px;padding:5px 10px;border-radius:6px;font-weight:600}
.nav button:hover{background:#f0f0f0}
.path{flex:1;font-size:14px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tb{display:flex;gap:10px;margin-bottom:18px}
.btn{padding:9px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
.bp{background:#2c3e50;color:#fff}.bp:hover{background:#34495e}
.bs{background:#fff;color:#2c3e50;border:1px solid #ddd}.bs:hover{background:#f8f9fa}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:18px 12px 12px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.07)}
.ic{font-size:42px;cursor:pointer;margin-bottom:8px;user-select:none}
.nm{font-weight:700;font-size:13px;color:#2c3e50;cursor:pointer;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nm:hover{color:#3498db}
.mt{font-size:11px;color:#999;margin-top:4px}
.ca{display:flex;gap:4px;margin-top:auto;padding-top:10px;opacity:0;transition:opacity .15s;width:100%;justify-content:center}
.card:hover .ca{opacity:1}
.bi{background:#f4f4f4;border:none;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:11px;color:#666;font-weight:500}
.bi:hover{background:#e8e8e8}
.bi.dg:hover{background:#fdecea;color:#e74c3c}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:#aaa;background:#fff;border:2px dashed #e0e0e0;border-radius:12px}
.empty .ei{font-size:48px;margin-bottom:10px}
#ov{position:fixed;inset:0;background:rgba(255,255,255,.93);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:90;gap:12px;transition:opacity .3s}
#ov.h{opacity:0;pointer-events:none}
.sp{width:34px;height:34px;border:3px solid #ddd;border-top-color:#2c3e50;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#mb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
#mb.show{display:flex}
.mo{background:#fff;border-radius:14px;width:100%;max-width:420px;padding:22px;box-shadow:0 16px 48px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.mo h3{font-size:16px;color:#2c3e50;margin-bottom:16px}
.mo label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:5px;margin-top:12px}
.mo label:first-of-type{margin-top:0}
.mo input,.mo select{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;outline:none;font-family:inherit}
.mo input:focus{border-color:#2c3e50}
.mo .msg{font-size:14px;color:#444;line-height:1.5}
.mo .act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.mo .act button{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.mk{background:#2c3e50;color:#fff}.mk:hover{background:#34495e}
.mc{background:#f0f0f0;color:#555}.mc:hover{background:#e4e4e4}
.md{background:#e74c3c;color:#fff}.md:hover{background:#c0392b}
.hint{font-size:11px;color:#999;margin-top:4px}
#toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:120;transform:translateY(80px);opacity:0;transition:all .3s;color:#fff}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{background:#27ae60}
#toast.er{background:#e74c3c}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.card{min-height:135px;padding:14px 10px 12px}.ic{font-size:36px}.ca{opacity:1}body{padding:16px 10px}}
</style>
</head>
<body>

<div id="ov">
<div class="sp"></div>
<div style="font-size:14px;color:#555;font-weight:600">Memuat data...</div>
</div>

<div class="hd">
<h1>📁 Arsip Lembar Kerja</h1>
<span id="st" class="st-wait">⏳</span>
</div>

<div class="nav">
<button id="bb" onclick="goBack()" style="display:none">← Kembali</button>
<span class="path" id="pt">Beranda</span>
</div>

<div class="tb">
<button class="btn bs" id="bF" onclick="newFolder()">📂 + Folder</button>
<button class="btn bp" id="bL" onclick="newLink()">📄 + Lembar Kerja</button>
</div>

<div class="grid" id="list"></div>
<div id="mb"></div>
<div id="toast"></div>

<script>
var MK="$2a$10$BCdyrhALUzXee8NI.yNV6.glef2ECbzFPRSrM62oIiC/mg/z3Z0H2";
var BID="6a852125f5f4af5e2926f117";
var API="https://api.jsonbin.io/v3/b/"+BID;

var data={id:"root",type:"folder",name:"Beranda",children:[]};
var cPath=[data];
var cFolder=data;
var busy=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function esc(t){
return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return"link"}}

function normUrl(v){
var u=String(v||"").trim();
if(!u)return null;
if(!/^https?:\/\//i.test(u))u="https://"+u;
try{var p=new URL(u);return(p.protocol==="http:"||p.protocol==="https:")?p.href:null}catch(e){return null}
}

function setSt(t,c){var e=document.getElementById("st");e.textContent=t;e.className=c}

function toast(m,ok){
var e=document.getElementById("toast");
e.textContent=m;e.className="show "+(ok?"ok":"er");
setTimeout(function(){e.className=""},2500);
}

function setBusy(b){
busy=b;
document.getElementById("bF").disabled=b;
document.getElementById("bL").disabled=b;
}

// ===== MODAL =====
function closeModal(){document.getElementById("mb").className="";document.getElementById("mb").innerHTML=""}

function openModal(h){
var b=document.getElementById("mb");b.innerHTML=h;b.className="show";
var f=b.querySelector("input,select");if(f)setTimeout(function(){f.focus()},50);
}

function ask(title,fields,okText){
return new Promise(function(res){
var html=fields.map(function(f,i){
return '<label>'+esc(f.label)+'</label>'
+'<input id="mf'+i+'" type="text" value="'+esc(f.value||"")+'" placeholder="'+esc(f.placeholder||"")+'">'
+(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':"");
}).join("");
openModal('<div class="mo"><h3>'+esc(title)+'</h3>'+html
+'<div class="act"><button class="mc" id="mC">Batal</button>'
+'<button class="mk" id="mO">'+esc(okText||"Simpan")+'</button></div></div>');
function fin(v){closeModal();res(v)}
document.getElementById("mC").onclick=function(){fin(null)};
document.getElementById("mO").onclick=function(){
fin(fields.map(function(_,i){return document.getElementById("mf"+i).value}));
};
document.getElementById("mb").onclick=function(e){if(e.target.id==="mb")fin(null)};
document.getElementById("mb").onkeydown=function(e){
if(e.key==="Enter")document.getElementById("mO").click();
if(e.key==="Escape")fin(null);
};
});
}

function confirmBox(title,msg){
return new Promise(function(res){
openModal('<div class="mo"><h3>'+esc(title)+'</h3><div class="msg">'+esc(msg)+'</div>'
+'<div class="act"><button class="mc" id="mC">Batal</button>'
+'<button class="md" id="mO">Hapus</button></div></div>');
function fin(v){closeModal();res(v)}
document.getElementById("mC").onclick=function(){fin(false)};
document.getElementById("mO").onclick=function(){fin(true)};
document.getElementById("mb").onclick=function(e){if(e.target.id==="mb")fin(false)};
document.getElementById("mb").onkeydown=function(e){if(e.key==="Escape")fin(false)};
});
}

function alertBox(title,msg){
return new Promise(function(res){
openModal('<div class="mo"><h3>'+esc(title)+'</h3><div class="msg">'+esc(msg)+'</div>'
+'<div class="act"><button class="mk" id="mO">OK</button></div></div>');
function fin(){closeModal();res()}
document.getElementById("mO").onclick=fin;
document.getElementById("mb").onclick=function(e){if(e.target.id==="mb")fin()};
document.getElementById("mb").onkeydown=function(e){if(e.key==="Enter"||e.key==="Escape")fin()};
});
}

// ===== NORMALIZE =====
function normTree(it){
if(!it||typeof it!=="object")return null;
var n={id:it.id||uid(),name:String(it.name||"Tanpa Nama"),type:it.type==="link"?"link":"folder"};
if(n.type==="folder"){n.children=Array.isArray(it.children)?it.children.map(normTree).filter(Boolean):[]}
else{n.url=String(it.url||"https://")}
return n;
}

// ===== CLOUD — PERSIS TEST =====
async function cloudGet(){
var r=await fetch(API+"/latest",{headers:{"X-Master-Key":MK}});
if(!r.ok)throw new Error("HTTP "+r.status);
var j=await r.json();
return normTree(j.record);
}

async function cloudSave(){
var r=await fetch(API,{
method:"PUT",
headers:{"Content-Type":"application/json","X-Master-Key":MK},
body:JSON.stringify(data)
});
if(!r.ok){
var t=await r.text().catch(function(){return""});
throw new Error("HTTP "+r.status+" "+t.substring(0,150));
}
}

// ===== SAVE: LANGSUNG, TUNGGU SELESAI =====
async function save(){
setSt("⏳ Menyimpan...","st-wait");
setBusy(true);
try{
await cloudSave();
setSt("● Online","st-ok");
toast("Tersimpan ✓",true);
}catch(e){
console.error(e);
setSt("✕ Gagal","st-err");
toast("Gagal: "+e.message,false);
}
setBusy(false);
}

// ===== NAV =====
function findPath(f,id,p){
p=p||[];var np=p.concat(f);
if(f.id===id)return np;
var ch=f.children||[];
for(var i=0;i<ch.length;i++){
if(ch[i].type==="folder"){var r=findPath(ch[i],id,np);if(r)return r}
}
return null;
}

function isDesc(a,b){
if(a===b)return true;
if(a.type!=="folder")return false;
return(a.children||[]).some(function(c){return c.type==="folder"&&isDesc(c,b)});
}

function setFolder(p){
cPath=p;cFolder=p[p.length-1];
history.replaceState(null,"","#"+cFolder.id);
render();
}

function openFolder(i){
var f=cFolder.children[i];
if(f&&f.type==="folder")setFolder(cPath.concat(f));
}

function goBack(){if(cPath.length>1)setFolder(cPath.slice(0,-1))}

// ===== CRUD =====
async function newFolder(){
if(busy)return;
var r=await ask("Folder baru",[{label:"Nama folder",placeholder:"Contoh: Administrasi"}],"Buat");
if(!r||!r[0].trim())return;
cFolder.children.push({id:uid(),type:"folder",name:r[0].trim(),children:[]});
render();
await save();
}

async function newLink(){
if(busy)return;
var r=await ask("Lembar kerja baru",[
{label:"Nama lembar kerja",placeholder:"Contoh: Laporan Januari"},
{label:"Alamat URL",value:"https://",placeholder:"https://drive.google.com/...",hint:"Tempel URL lengkap dari Google Drive/Docs/Sheets"}
],"Simpan");
if(!r||!r[0].trim())return;
var u=normUrl(r[1]);
if(!u){await alertBox("URL tidak valid","Contoh yang benar:\nhttps://drive.google.com/file/d/xxxxx/view");return}
cFolder.children.push({id:uid(),type:"link",name:r[0].trim(),url:u});
render();
await save();
}

async function editFolder(i){
if(busy)return;
var it=cFolder.children[i];
var r=await ask("Ubah folder",[{label:"Nama folder",value:it.name}],"Simpan");
if(!r||!r[0].trim())return;
it.name=r[0].trim();
render();
await save();
}

async function editLink(i){
if(busy)return;
var it=cFolder.children[i];
var r=await ask("Ubah lembar kerja",[
{label:"Nama lembar kerja",value:it.name},
{label:"Alamat URL",value:it.url}
],"Simpan");
if(!r||!r[0].trim())return;
var u=normUrl(r[1]);
if(!u){await alertBox("URL tidak valid","Masukkan URL yang benar.");return}
it.name=r[0].trim();it.url=u;
render();
await save();
}

async function delItem(i){
if(busy)return;
var it=cFolder.children[i];
var ok=await confirmBox("Hapus",'Hapus "'+it.name+'"?');
if(!ok)return;
cFolder.children.splice(i,1);
render();
await save();
}

async function moveItem(i){
if(busy)return;
var it=cFolder.children[i];
var targets=[];
(function scan(f,p){
if(it.type==="folder"&&isDesc(it,f))return;
if(f!==cFolder)targets.push({f:f,p:p});
(f.children||[]).forEach(function(c){if(c.type==="folder")scan(c,p+" / "+c.name)});
})(data,data.name);
if(!targets.length){await alertBox("Tidak bisa","Tidak ada folder tujuan.");return}

var opts=targets.map(function(t,idx){return'<option value="'+idx+'">'+esc(t.p)+'</option>'}).join("");
openModal('<div class="mo"><h3>Pindahkan</h3>'
+'<label>Pindahkan "'+esc(it.name)+'" ke:</label>'
+'<select id="mf0">'+opts+'</select>'
+'<div class="act"><button class="mc" id="mC">Batal</button>'
+'<button class="mk" id="mO">Pindah</button></div></div>');

function fin(v){closeModal();if(v===null)return;
var sel=parseInt(v,10);
if(isNaN(sel)||sel<0||sel>=targets.length)return;
cFolder.children.splice(i,1);
targets[sel].f.children.push(it);
render();
save();
}
document.getElementById("mC").onclick=function(){fin(null)};
document.getElementById("mO").onclick=function(){fin(document.getElementById("mf0").value)};
document.getElementById("mb").onclick=function(e){if(e.target.id==="mb")fin(null)};
}

// ===== RENDER =====
function render(){
document.getElementById("pt").textContent=cPath.map(function(f){return f.name}).join(" / ");
document.getElementById("bb").style.display=cPath.length>1?"block":"none";
var list=document.getElementById("list");
var ch=cFolder.children||[];
if(!ch.length){
list.innerHTML='<div class="empty"><div class="ei">📂</div>Folder kosong.</div>';
return;
}
var items=ch.map(function(item,i){return{item:item,i:i}})
.sort(function(a,b){return a.item.type===b.item.type?0:(a.item.type==="folder"?-1:1)});

list.innerHTML=items.map(function(row){
var it=row.item,i=row.i;
if(it.type==="folder"){
var cnt=(it.children||[]).length;
return '<div class="card">'
+'<div class="ic" data-a="open" data-i="'+i+'">📁</div>'
+'<div class="nm" data-a="open" data-i="'+i+'">'+esc(it.name)+'</div>'
+'<div class="mt">'+cnt+' item</div>'
+'<div class="ca">'
+'<button class="bi" data-a="ef" data-i="'+i+'">✏️</button>'
+'<button class="bi" data-a="mv" data-i="'+i+'">📦</button>'
+'<button class="bi dg" data-a="dl" data-i="'+i+'">🗑️</button>'
+'</div></div>';
}
return '<div class="card">'
+'<div class="ic" data-a="ol" data-i="'+i+'">📄</div>'
+'<div class="nm" data-a="ol" data-i="'+i+'">'+esc(it.name)+'</div>'
+'<div class="mt">'+esc(hostOf(it.url))+'</div>'
+'<div class="ca">'
+'<button class="bi" data-a="el" data-i="'+i+'">✏️</button>'
+'<button class="bi" data-a="mv" data-i="'+i+'">📦</button>'
+'<button class="bi dg" data-a="dl" data-i="'+i+'">🗑️</button>'
+'</div></div>';
}).join("");
}

// Event delegation
document.getElementById("list").addEventListener("click",function(e){
var el=e.target.closest("[data-a]");
if(!el)return;
var a=el.getAttribute("data-a");
var i=parseInt(el.getAttribute("data-i"),10);
if(a==="open")openFolder(i);
if(a==="ol"){
var url=cFolder.children[i]?cFolder.children[i].url:null;
if(url)window.open(url,"_blank","noopener");
}
if(a==="ef")editFolder(i);
if(a==="el")editLink(i);
if(a==="mv")moveItem(i);
if(a==="dl")delItem(i);
});

// ===== INIT =====
async function init(){
try{
var d=await cloudGet();
if(d)data=d;
setSt("● Online","st-ok");
}catch(e){
console.error(e);
setSt("✕ Gagal muat","st-err");
toast("Gagal: "+e.message,false);
}
var hid=location.hash.replace("#","");
if(hid){var p=findPath(data,hid);if(p){cPath=p;cFolder=p[p.length-1]}}
render();
document.getElementById("ov").className="h";
}

window.addEventListener("hashchange",function(){
var id=location.hash.replace("#","");
if(!id)return;
var p=findPath(data,id);
if(p){cPath=p;cFolder=p[p.length-1];render()}
});

init();
</script>
</body>
</html>
